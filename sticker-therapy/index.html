<html lang="en">

    <title>Sticker Therapy: Cozy Rooms</title>
    <style id="expo-reset">
      html, body { height: 100%; background: #fdf1f3; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      #boot { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fdf1f3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; transition: opacity .35s ease; }
      #boot .boot-name { font-size: 30px; font-weight: 800; color: #bd5274; animation: bootpulse 1.8s ease-in-out infinite; }
      #boot .boot-sub { margin-top: 8px; font-size: 15px; color: #7d5d64; }
      @keyframes bootpulse { 0%, 100% { opacity: .45; transform: scale(.98); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-name { animation: none; opacity: 1; } }
    </style>
  <link rel="icon" href="/sticker-therapy/favicon.ico"/></head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <!-- Branded boot screen: removed by src/app/_layout.tsx once the app mounts. -->
    <div id="boot" role="status" aria-label="Loading Sticker Therapy">
      <div class="boot-name">Sticker Therapy</div>
      <div class="boot-sub">Getting your rooms ready</div>
    </div>
    <script>
      // Safety net so a failed load never leaves the boot screen covering an error.
      setTimeout(function () { var b = document.getElementById('boot'); if (b && b.parentNode) b.parentNode.removeChild(b); }, 20000);
      // Boot line in the saved (or device) language, same rule as src/i18n.
      try {
        var l = 'auto';
        try { l = JSON.parse(localStorage.getItem('sn:settings:v1') || '{}').lang || 'auto'; } catch (e) {}
        if (l === 'auto') { var n = (navigator.language || '').toLowerCase(); l = n.indexOf('pt') === 0 ? 'pt-BR' : n.indexOf('es') === 0 ? 'es' : 'en'; }
        var sub = { 'pt-BR': 'Preparando seus cômodos', es: 'Preparando tus habitaciones' }[l];
        if (sub) document.querySelector('#boot .boot-sub').textContent = sub;
      } catch (e) {}
    </script>
