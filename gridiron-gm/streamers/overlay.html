<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gridiron GM stream overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* OBS Browser Source, 1920x1080, transparent. Options are URL parameters,
     see the kit README. Nothing here needs a network except the two fonts,
     which fall back to Impact and Arial. */
  :root {
    --ink: #080b12;
    --ink-2: #10151f;
    --cream: #fff6e6;
    --sand: #b9c2d4;
    --flood: #e89b3c;
    --flood-light: #ffd9a0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .stage { position: absolute; inset: 0; transform-origin: 0 0; }
  .slot { position: absolute; display: flex; flex-direction: column; gap: 14px; }
  .slot.bl { left: 56px; bottom: 56px; align-items: flex-start; }
  .slot.br { right: 56px; bottom: 56px; align-items: flex-end; }
  .slot.tl { left: 56px; top: 56px; align-items: flex-start; }
  .slot.tr { right: 56px; top: 56px; align-items: flex-end; }
  .slot.tl, .slot.tr { flex-direction: column-reverse; }

  .card {
    display: flex; align-items: center; gap: 22px;
    min-width: 560px; max-width: 760px;
    padding: 20px 30px 20px 20px;
    border-radius: 26px;
    background: rgba(8, 11, 18, 0.9);
    border: 2px solid rgba(255, 217, 160, 0.34);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    position: relative; overflow: hidden;
    opacity: 0; transform: translateX(-40px);
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.2, 0.9, 0.25, 1);
  }
  .slot.br .card, .slot.tr .card { transform: translateX(40px); }
  .card.on { opacity: 1; transform: none; }
  .icon { width: 108px; height: 108px; border-radius: 26px; flex: none; display: block; }
  .txt { min-width: 0; }
  .title {
    font-family: 'Barlow Condensed', Impact, 'Arial Narrow', sans-serif; font-weight: 800;
    font-size: 54px; line-height: 1; letter-spacing: 0.5px; color: var(--cream);
    text-transform: uppercase;
  }
  .title em { font-style: normal; color: var(--flood); }
  .sub {
    font-family: 'Inter', Arial, sans-serif; font-weight: 500;
    font-size: 26px; line-height: 1.3; color: var(--sand); margin-top: 8px;
  }
  .sub b { color: var(--cream); font-weight: 600; }
  .qr {
    width: 176px; height: 176px; flex: none; padding: 10px; border-radius: 18px; background: #fff;
  }
  .qr svg { width: 100%; height: 100%; display: block; }
  .timer {
    position: absolute; left: 0; bottom: 0; height: 5px; width: 100%;
    background: var(--flood); transform-origin: 0 50%;
  }
  .badge {
    display: flex; align-items: center; gap: 12px; padding: 8px 20px 8px 8px; border-radius: 999px;
    background: rgba(8, 11, 18, 0.82); border: 2px solid rgba(255, 217, 160, 0.28);
    opacity: 0; transition: opacity 0.5s ease;
  }
  .badge.on { opacity: 1; }
  .badge img { width: 46px; height: 46px; border-radius: 12px; display: block; }
  .badge span { font-family: 'Inter', Arial, sans-serif; font-weight: 600; font-size: 22px; color: var(--cream); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
    .card { transform: none !important; transition: opacity 0.3s ease; }
  }
</style>
</head>

<script>
(function () {
  var q = new URLSearchParams(location.search)
  var num = function (k, d) { var v = parseFloat(q.get(k)); return isFinite(v) && v > 0 ? v : d }
  var tag = (q.get('tag') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 28)
  var ct = 'stream' + (tag ? '-' + tag : '')
  var LINK = 'https://apps.apple.com/app/id6807910129?pt=129118166&ct=' + ct + '&mt=8'
  var pos = ['bl', 'br', 'tl', 'tr'].indexOf(q.get('pos')) >= 0 ? q.get('pos') : 'bl'
  var interval = num('interval', 75)   // seconds hidden between cards
  var show = num('show', 12)           // seconds each card stays up
  var scale = num('scale', 1)
  var badgeOn = q.get('badge') !== '0'
  var demo = q.get('demo') === '1'
  var ICON = document.querySelector('#badge img').src

  document.getElementById('slot').className = 'slot ' + pos
  document.getElementById('stage').style.transform = 'scale(' + scale + ')'

  var qrSvg = ''
  try {
    var qr = qrcode(0, 'M'); qr.addData(LINK); qr.make()
    qrSvg = qr.createSvgTag({ scalable: true, margin: 0 })
  } catch (e) { qrSvg = '' }

  var CARDS = [
    { title: 'Gridiron <em>GM</em>', sub: 'Run a pro football front office.<br><b>Free on iPhone.</b>' },
    { title: 'Your call. Your cap.', sub: 'Draft, trade, restructure.<br>Every deal has a price.' },
    { title: 'Scan to play', sub: 'Or search <b>Gridiron GM</b><br>on the App Store.', qr: true }
  ]

  var card = document.getElementById('card'), badge = document.getElementById('badge'), n = parseInt(q.get('card'), 10) || 0, timer
  function build(c) {
    var side = c.qr && qrSvg ? '<div class="qr">' + qrSvg + '</div>' : '<img class="icon" alt="" src="' + ICON + '">'
    card.innerHTML = side + '<div class="txt"><div class="title">' + c.title + '</div><div class="sub">' + c.sub + '</div></div><div class="timer" id="timer"></div>'
  }
  function showCard() {
    build(CARDS[n % CARDS.length]); n++
    var t = document.getElementById('timer')
    t.style.transition = 'none'; t.style.transform = 'scaleX(1)'
    void card.offsetWidth
    card.classList.add('on')
    t.style.transition = 'transform ' + show + 's linear'; t.style.transform = 'scaleX(0)'
    setTimeout(hideCard, show * 1000)
  }
  function hideCard() {
    card.classList.remove('on')
    if (badgeOn) badge.classList.add('on')
    timer = setTimeout(function () { badge.classList.remove('on'); setTimeout(showCard, 500) }, (demo ? 3 : interval) * 1000)
  }
  if (badgeOn) badge.classList.add('on')
  setTimeout(function () { badge.classList.remove('on'); setTimeout(showCard, 500) }, (demo ? 500 : 8000))
})()
</script>
