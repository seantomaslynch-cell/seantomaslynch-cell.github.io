<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Challenge | LifeLine</title>
<meta name="apple-itunes-app" content="app-id=6806907577">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(80% 60% at 35% 35%, #1a1826, #0F0E15 60%, #08070B);
    color: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  main { max-width: 32rem; text-align: center; }
  .badge {
    display: inline-block; font-size: .75rem; letter-spacing: .12em;
    text-transform: uppercase; color: #FBBF24; border: 1px solid #FBBF2455;
    border-radius: 999px; padding: .35rem .75rem; margin-bottom: 1.25rem;
  }
  h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); margin: 0 0 .75rem; line-height: 1.15; }
  p { color: #9CA3AF; line-height: 1.6; margin: 0 0 1.75rem; font-size: 1.05rem; }
  a.cta {
    display: inline-block; background: #FBBF24; color: #0B0A0F;
    font-weight: 700; text-decoration: none; padding: .85rem 1.6rem;
    border-radius: 999px;
  }
  svg { width: min(100%, 20rem); height: auto; margin-bottom: 1.5rem; }
  footer { margin-top: 2.5rem; font-size: .8rem; color: #6B7280; }
  footer a { color: #9CA3AF; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 480 200" role="img" aria-label="A pulse line rising to a bright point">
    <path d="M 30 140 H 110 L 130 80 L 150 180 L 170 100 L 195 140
             C 250 141 285 120 320 82 C 340 62 358 50 374 44"
          fill="none" stroke="#22C55E" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="392" cy="40" r="19" fill="#0B0A0F"/>
    <circle cx="392" cy="40" r="15" fill="#FBBF24"/>
  </svg>
  <div class="badge">Challenge</div>
  <h1>Weekly Challenge</h1>
  <p>One challenge a week, drawn from forty. Finish it inside a single life and the rewind tokens are yours.</p>
  <a class="cta" href="https://apps.apple.com/app/id6806907577">Open in LifeLine</a>
  <footer>
    If you already have the game, this link opens it.
    <br><a href="https://seantomaslynch-cell.github.io/lifeline-game/">About LifeLine</a>
  </footer>
</main>
</body>
</html>
